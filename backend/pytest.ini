[pytest]
# Treat backend/ as the import root so tests can do `from app.services...`
pythonpath = .
testpaths = tests
# Fail on typos in marker names instead of silently creating new ones.
addopts = --strict-markers
markers =
    semantic: needs a REAL (semantic) embedding model; skipped while the mock provider is configured. See tests/README.md.
filterwarnings =
    # chromadb 1.5.9 stores an internal {"type": "legacy"} marker when a collection has no
    # embedding function (we deliberately supply our own vectors), then warns about its own
    # marker. Harmless; ignore only this exact message so other warnings stay visible.
    ignore:legacy embedding function config:DeprecationWarning:chromadb
